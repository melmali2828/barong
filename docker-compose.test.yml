version: "3.7"
services:
  database:
    image: mysql:5.7
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"

  rabbitmq:
    image: rabbitmq:3.8.9
    ports:
      - "5672:5672"

  vault:
    image: vault:0.11.4
    cap_add:
      - IPC_LOCK
    environment:
      SKIP_SETCAP: 1
      VAULT_DEV_ROOT_TOKEN_ID: changeme
    ports:
      - "8200:8200"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
